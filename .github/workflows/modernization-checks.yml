name: Modernization checks

# Every PR: spec rules, traceability, style; then, on GKE, the harness against the legacy AND
# the new service and the parity report (standards/modernization.md MOD-6, MOD-7, MOD-10).
# GKE jobs run only when the repository variables for Google Cloud are set.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write          # keyless sign-in to Google Cloud (Workload Identity Federation)

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Specs follow the rules (as-is MOD-2..4, to-be enterprise sections)
        run: python scripts/check_spec.py
      - name: Every behaviour and criterion has a test; every deviation is approved
        run: python scripts/check_traceability.py
      - name: Legacy code is read-only (fixes happen in the new service)
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -E '^legacy/.*/src/'; then
            echo "::error::Changes to legacy source code are not allowed; fix it in services/ as an approved deviation."
            exit 1
          fi
      - name: Style (ruff)
        run: pip install -q ruff==0.16.9 && ruff format --check . && ruff check .

  sandbox:
    needs: rules
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      NS: mod-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v3
        with: { cluster_name: "${{ vars.GKE_CLUSTER }}", location: "${{ vars.GCP_REGION }}" }
      - name: Legacy and new service side by side in a fresh namespace
        run: scripts/sandbox.sh all
      - name: Parity report (golden traffic, both services)
        run: scripts/sandbox.sh compare
      - name: Post harness and parity results on the PR
        if: always()
        run: scripts/sandbox.sh publish
        env: { GH_TOKEN: "${{ github.token }}" }
